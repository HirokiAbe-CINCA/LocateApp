name: Release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  package:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python helper dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[dev]'

      - name: Verify
        run: |
          .venv/bin/python -m pytest
          bash scripts/run_swift_core_checks.sh
          swift build
          python -m py_compile scripts/generate_app_icon.py scripts/generate_dmg_background.py scripts/verify_sparkle_keypair.py
          bash -n scripts/build_app_bundle.sh scripts/build_helper.sh scripts/clean_generated.sh scripts/e2e_smoke.sh scripts/import_apple_certificate.sh scripts/package_release.sh scripts/verify_release_artifacts.sh scripts/generate_sparkle_appcast.sh scripts/run_swift_core_checks.sh

      - name: Prepare Apple signing certificate
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          ./scripts/import_apple_certificate.sh

      - name: Package release
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [[ -n "${APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64:-}" &&
                -n "${APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD:-}" &&
                -n "${APPLE_KEYCHAIN_PASSWORD:-}" &&
                -n "${APPLE_SIGNING_IDENTITY:-}" ]]; then
            export SIGNING_IDENTITY="$APPLE_SIGNING_IDENTITY"
          fi
          REQUIRE_SPARKLE_APPCAST=1 NOTARIZE=1 VERSION="${GITHUB_REF_NAME#v}" ./scripts/package_release.sh

      - name: Verify release artifacts
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          REQUIRE_SPARKLE_APPCAST=1 EXPECT_NOTARIZED=1 VERSION="${GITHUB_REF_NAME#v}" ./scripts/verify_release_artifacts.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            release/*.zip
            release/*.dmg
            release/SHA256SUMS.txt
          )
          if [[ -f release/appcast.xml ]]; then
            assets+=(release/appcast.xml)
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release/RELEASE_NOTES.md

      - name: Prepare Sparkle appcast Pages artifact
        if: ${{ hashFiles('release/appcast.xml') != '' }}
        run: |
          mkdir -p pages
          cp release/appcast.xml pages/appcast.xml

      - name: Configure GitHub Pages
        if: ${{ hashFiles('release/appcast.xml') != '' }}
        uses: actions/configure-pages@v6

      - name: Upload Sparkle appcast Pages artifact
        if: ${{ hashFiles('release/appcast.xml') != '' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

      - name: Deploy Sparkle appcast to GitHub Pages
        if: ${{ hashFiles('release/appcast.xml') != '' }}
        uses: actions/deploy-pages@v5
