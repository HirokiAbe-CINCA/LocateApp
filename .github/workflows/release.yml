name: Release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python helper dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[dev]'

      - name: Verify
        run: |
          .venv/bin/python -m pytest
          swift run LocateAppCoreChecks
          swift build
          bash -n scripts/build_app_bundle.sh scripts/build_helper.sh scripts/clean_generated.sh scripts/e2e_smoke.sh scripts/import_apple_certificate.sh scripts/package_release.sh scripts/verify_release_artifacts.sh

      - name: Prepare Apple signing certificate
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          ./scripts/import_apple_certificate.sh

      - name: Package release
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          if [[ -n "${APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64:-}" &&
                -n "${APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD:-}" &&
                -n "${APPLE_KEYCHAIN_PASSWORD:-}" &&
                -n "${APPLE_SIGNING_IDENTITY:-}" ]]; then
            export SIGNING_IDENTITY="$APPLE_SIGNING_IDENTITY"
          fi
          NOTARIZE=auto VERSION="${GITHUB_REF_NAME#v}" ./scripts/package_release.sh

      - name: Verify release artifacts
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          if [[ -n "${APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64:-}" &&
                -n "${APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD:-}" &&
                -n "${APPLE_KEYCHAIN_PASSWORD:-}" &&
                -n "${APPLE_SIGNING_IDENTITY:-}" &&
                -n "${APPLE_NOTARY_KEY_P8_BASE64:-}" &&
                -n "${APPLE_NOTARY_KEY_ID:-}" &&
                -n "${APPLE_NOTARY_ISSUER_ID:-}" ]]; then
            EXPECT_NOTARIZED=1 VERSION="${GITHUB_REF_NAME#v}" ./scripts/verify_release_artifacts.sh
          else
            VERSION="${GITHUB_REF_NAME#v}" ./scripts/verify_release_artifacts.sh
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/*.zip \
            release/*.dmg \
            release/SHA256SUMS.txt \
            --title "$GITHUB_REF_NAME" \
            --notes-file release/RELEASE_NOTES.md
